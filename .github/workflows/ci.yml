name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (C-1..C-6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run contracts/check.py
      # tools/ is linted here and nowhere else: the dataplane job runs with
      # working-directory: dataplane, so its `ruff check .` never reaches the repo root,
      # and coverage only sources src/dataplane. That gap is how a sweep runner that
      # cannot execute a single point on Linux passed both workflows green.
      - run: uv run --with ruff ruff check contracts/check.py fixtures tools
      # format --check deliberately excludes tools/. Formatting is a style claim and
      # these scripts came from two people; the check above is the one that catches bugs.
      - run: uv run --with ruff ruff format --check contracts/check.py fixtures

  dataplane:
    name: "Data plane — Divyansh (A)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataplane
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  controlplane:
    name: "Control plane — Aditya (B)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build and test Control Plane (Java)
        working-directory: ./controlplane
        # `test`, not `compile`. The policies decide where every request goes, and the four
        # bugs fixed on 2026-09-03 all compiled cleanly, so compiling was never evidence of
        # anything. The tests read contracts/ through a relative path, which resolves from
        # this working directory.
        run: mvn clean test
