name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (C-1..C-6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Validates every file in contracts/examples/ against its schema and
      # compiles scheduling.proto. If you add a field, add it to the example in
      # the same commit — an example that no longer exercises the schema is how
      # drift gets in (§12.2).
      - run: uv run contracts/check.py
      # contracts/check.py lives outside dataplane/, so it needs its own lint pass.
      - run: uv run --with ruff ruff check contracts/check.py
      - run: uv run --with ruff ruff format --check contracts/check.py


  dataplane:
    name: "Data plane — Divyansh (A)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataplane
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

    controlplane:
    name: "Control plane — Aditya (B)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PLACEHOLDER. F-21 leaves B free to choose any gRPC-capable language for
      # scheduler + policies + DES — but B must choose ONCE, and the choice is a
      # Week-1 freeze item. Replace this step with the real build/test
      # invocation when the language is committed.
      - name: Build Control Plane (Java)
        working-directory: ./controlplane
        run: mvn clean compile
