[project]
name = "dataplane"
version = "0.1.0"
description = "Divyansh (A) — worker wrapper, measurement harness, results pipeline, figures"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "grpcio>=1.60",       # C-1 transport
    "grpcio-tools>=1.60", # stub generation from contracts/scheduling.proto
    "httpx>=0.28.1",      # llama-server is an HTTP binary; this is the whole engine adapter
    "numpy>=1.26",        # SeedSequence-based trace generation (F-16)
    "pandas>=3.0.5",      # C-5 join
    "pyarrow>=25.0.1",    # C-5 Parquet
    "matplotlib>=3.11.1", # figures (F-19)
]

# No engine dependency: under F-9 the pool worker talks HTTP to a local
# llama-server, so nothing here pulls CUDA wheels and the pipeline stays
# laptop-runnable. Only the one-off F-9b engine-gap probe touches vLLM, and only
# if driven as a library rather than through its OpenAI-compatible server —
# install that in a throwaway environment, not here.

[project.scripts]
gen-trace = "dataplane.harness.gen_trace:main"
replay    = "dataplane.harness.replay:main"
pipeline  = "dataplane.pipeline.join:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jsonschema>=4.21", # C-4 conformance from the harness's own suite, not just contracts/check.py
]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
